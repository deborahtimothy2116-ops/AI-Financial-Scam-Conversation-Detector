services:
  postgres:
    image: postgres:16-alpine
    container_name: scamshield_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: scamshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scamshield_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scamshield_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=ScamShield AI
      - APP_ENV=production
      - DEBUG=False
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/scamshield_db
      - SECRET_KEY=scamshield-production-jwt-secret-key-32-chars-min
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - LLM_PROVIDER=rule_based
      - LLM_FALLBACK_TO_RULE_BASED=True
      - BACKEND_CORS_ORIGINS=["*"]
      - MAX_UPLOAD_SIZE_MB=10
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend

volumes:
  postgres_data:
